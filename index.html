<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omnicube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="scene-wrapper">
  <!-- List view -->
  <div class="face-list" id="face-list">
    <div class="face-card face-front"  data-face-idx="0"></div>
    <div class="face-card face-right"  data-face-idx="1"></div>
    <div class="face-card face-back"   data-face-idx="2"></div>
    <div class="face-card face-left"   data-face-idx="3"></div>
    <div class="face-card face-top"    data-face-idx="4"></div>
    <div class="face-card face-bottom" data-face-idx="5"></div>
  </div>

  <!-- Cube view -->
  <div class="scene" id="scene">
    <div class="cube" id="cube">
      <div class="face face-front"></div>
      <div class="face face-back"></div>
      <div class="face face-right"></div>
      <div class="face face-left"></div>
      <div class="face face-top"></div>
      <div class="face face-bottom"></div>
    </div>
  </div>

  <!-- Nav arrows: centered over cube, sized to cube, overflow visible -->
  <div class="nav-arrows" id="nav-arrows">
    <div class="nav-arrow nav-arrow-up" id="arrow-up">
      <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
    </div>
    <div class="nav-arrow nav-arrow-down" id="arrow-down">
      <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="nav-arrow nav-arrow-left" id="arrow-left">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div class="nav-arrow nav-arrow-right" id="arrow-right">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
  </div>
</div>

<!-- Active face name -->
<div class="active-face-bar">
  <span class="active-face-name" id="active-face-name">World</span>
</div>

<!-- Bottom nav -->
<nav class="bottom-nav">

  <!-- Left: cube / list toggle -->
  <div class="view-toggle">
    <button class="toggle-btn active" id="btn-cube" aria-label="Cube view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
        <line x1="12" y1="22.08" x2="12" y2="12"/>
      </svg>
    </button>
    <button class="toggle-btn" id="btn-list" aria-label="List view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6"  x2="21" y2="6"/>
        <line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6"  x2="3.01" y2="6"/>
        <line x1="3" y1="12" x2="3.01" y2="12"/>
        <line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="nav-divider"></div>

  <!-- Center: 4 horizontal faces in ring order 0→1→2→3 -->
  <div class="face-nav" id="face-nav">
    <button class="face-nav-btn active" data-face-idx="0"></button>
    <button class="face-nav-btn"        data-face-idx="1"></button>
    <button class="face-nav-btn"        data-face-idx="2"></button>
    <button class="face-nav-btn"        data-face-idx="3"></button>
  </div>

  <div class="nav-divider"></div>

  <!-- Right: top / bottom -->
  <div class="vertical-face-nav">
    <button class="vert-face-btn" data-face-idx="4"></button>
    <button class="vert-face-btn" data-face-idx="5"></button>
  </div>

</nav>

<script type="module" src="js/cube.js"></script>
<script type="module" src="js/ui.js"></script>

</body>
</html>
