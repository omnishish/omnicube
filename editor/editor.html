<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omnicube Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.383.0/umd/lucide.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit}
:root{
  --bg:#0d1117;--surface:#161b27;--surface2:#1c2333;--surface3:#222a3a;
  --border:rgba(255,255,255,0.07);--border-hi:rgba(255,255,255,0.13);
  --text-dim:rgba(255,255,255,0.28);--text-mid:rgba(255,255,255,0.55);--text-hi:rgba(255,255,255,0.88);
  --accent:#4f8ef7;--accent-bg:rgba(79,142,247,0.14);--accent-hi:rgba(79,142,247,0.25);
  --danger:#ef4444;--danger-bg:rgba(239,68,68,0.12);--success:#22c55e;
  --r:8px;--preview-sz:272px;
}
html,body{height:100%}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text-hi);display:flex;flex-direction:column;overflow:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:99px}

/* ── HEADER ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:50px;border-bottom:1px solid var(--border);flex-shrink:0}
.header-title{font-size:13px;font-weight:600;letter-spacing:.2px}
.header-title span{color:var(--accent)}
.header-actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--r);font-size:12px;font-weight:500;transition:all .14s}
.btn-ghost{color:var(--text-mid);background:transparent;border:1px solid var(--border-hi)}
.btn-ghost:hover{background:var(--surface2);color:var(--text-hi)}
.btn-primary{background:var(--accent);color:#fff;border:1px solid transparent}
.btn-primary:hover{filter:brightness(1.1)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(239,68,68,.2)}
.btn-danger:hover{background:rgba(239,68,68,.2)}

/* ── LAYOUT ── */
.editor-layout{display:grid;grid-template-columns:188px 1fr 316px;flex:1;overflow:hidden}
.panel{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border)}
.panel:last-child{border-right:none;border-left:1px solid var(--border)}
.panel-head{padding:10px 14px;font-size:10px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:var(--text-dim);border-bottom:1px solid var(--border);flex-shrink:0}
.panel-body{flex:1;overflow-y:auto;padding:10px}

/* ── FACE TABS ── */
.face-tab{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:var(--r);cursor:pointer;transition:background .13s;margin-bottom:2px}
.face-tab:hover{background:var(--surface2)}
.face-tab.active{background:var(--accent-bg)}
.face-tab-dot{width:26px;height:26px;border-radius:6px;flex-shrink:0}
.face-tab-name{font-size:12px;font-weight:500;color:var(--text-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.face-tab.active .face-tab-name{color:var(--accent)}
.face-tab-meta{font-size:10px;color:var(--text-dim)}

/* ── PREVIEW ── */
.preview-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;overflow:hidden;position:relative;background:var(--bg)}
.preview-center::before{content:'';position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(79,142,247,0.06) 0%,transparent 70%);pointer-events:none}
.preview-face{width:var(--preview-sz);height:var(--preview-sz);border-radius:12px;overflow:hidden;position:relative;flex-shrink:0;container-type:inline-size;box-shadow:0 24px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.12)}
.preview-face::after{content:'';position:absolute;inset:0;background:linear-gradient(140deg,rgba(255,255,255,.09) 0%,transparent 55%);pointer-events:none;border-radius:inherit;z-index:1}
.preview-meta{display:flex;flex-direction:column;align-items:center;gap:4px}
.preview-face-name{font-size:10px;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;color:var(--text-dim)}
.preview-grid-label{font-size:10px;color:var(--text-dim);font-family:'JetBrains Mono',monospace}

/* ── BLOCK GRID ── */
.block-grid{display:grid;width:100%;height:100%;padding:10px;gap:6px}
.block{border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;overflow:hidden;position:relative;min-width:0;min-height:0;transition:outline .1s}
.block.selected-block{outline:2px solid var(--accent);outline-offset:-2px}
.block svg{flex-shrink:0}
.block-text-main{font-weight:600;letter-spacing:.3px;color:rgba(255,255,255,.9);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90%}
.block-body{line-height:1.5;color:rgba(255,255,255,.8);text-align:left;padding:2px 4px;display:-webkit-box;-webkit-line-clamp:5;line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.block-caption{color:rgba(255,255,255,.55);text-align:center}
.block-sub{color:rgba(255,255,255,.45)}

/* font size classes */
.fs-xs .block-text-main,.fs-xs .block-body{font-size:clamp(6px,1.4cqi,8px)}
.fs-xs svg{width:clamp(10px,2.5cqi,16px);height:clamp(10px,2.5cqi,16px)}
.fs-xs .block-caption,.fs-xs .block-sub{font-size:clamp(5px,1.2cqi,7px)}
.fs-sm .block-text-main,.fs-sm .block-body{font-size:clamp(7px,1.8cqi,10px)}
.fs-sm svg{width:clamp(12px,3cqi,18px);height:clamp(12px,3cqi,18px)}
.fs-sm .block-caption,.fs-sm .block-sub{font-size:clamp(6px,1.4cqi,8px)}
.fs-md .block-text-main,.fs-md .block-body{font-size:clamp(8px,2.2cqi,12px)}
.fs-md svg{width:clamp(14px,3.8cqi,22px);height:clamp(14px,3.8cqi,22px)}
.fs-md .block-caption,.fs-md .block-sub{font-size:clamp(7px,1.6cqi,9px)}
.fs-lg .block-text-main,.fs-lg .block-body{font-size:clamp(10px,2.8cqi,15px)}
.fs-lg svg{width:clamp(18px,5cqi,28px);height:clamp(18px,5cqi,28px)}
.fs-lg .block-caption,.fs-lg .block-sub{font-size:clamp(8px,2cqi,11px)}
.fs-xl .block-text-main,.fs-xl .block-body{font-size:clamp(12px,3.5cqi,18px)}
.fs-xl svg{width:clamp(22px,6.5cqi,36px);height:clamp(22px,6.5cqi,36px)}
.txt-bold .block-text-main,.txt-bold .block-body{font-weight:700}
.txt-italic .block-text-main,.txt-italic .block-body{font-style:italic}

/* block type base styles */
.block-link{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);cursor:pointer;transition:background .15s}
.block-link:hover{background:rgba(255,255,255,.22)}
.block-social{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);cursor:pointer;transition:background .15s}
.block-social:hover{background:rgba(255,255,255,.15)}
.block-text{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.08);align-items:flex-start;justify-content:flex-start;padding:8px}
.block-image{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08)}
.block-embed{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1)}
.block-header{background:transparent;border:none;align-items:flex-start;justify-content:flex-end;padding:0 2px 2px}
.block-header .block-text-main{font-weight:700;color:rgba(255,255,255,.95)}
.block-divider{background:transparent;border:none}
.block-divider::after{content:'';display:block;width:100%;height:1px;background:rgba(255,255,255,.18)}
.block-link::after,.block-social::after{content:'';position:absolute;inset:0;background:linear-gradient(140deg,rgba(255,255,255,.08) 0%,transparent 60%);pointer-events:none;border-radius:inherit}

/* ── INSPECTOR ── */
.inspector{display:flex;flex-direction:column}
.insp-section{border-bottom:1px solid var(--border);padding:13px 0 15px}
.insp-section:first-child{padding-top:0}
.insp-section-title{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:9px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:9px}
.field:last-child{margin-bottom:0}
.field label{font-size:11px;color:var(--text-dim);font-weight:500}
.field input,.field select,.field textarea{background:var(--surface2);border:1px solid var(--border-hi);border-radius:6px;color:var(--text-hi);font-size:12px;padding:6px 9px;outline:none;transition:border-color .15s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:60px;line-height:1.5}
.field select option{background:#1c2333}

/* color field */
.color-row{display:flex;align-items:center;gap:8px}
.color-swatch{width:28px;height:28px;border-radius:6px;border:1.5px solid var(--border-hi);cursor:pointer;flex-shrink:0;overflow:hidden;padding:0}
.color-swatch input[type=color]{width:200%;height:200%;margin:-50% 0 0 -50%;border:none;cursor:pointer;opacity:0;position:absolute}
.color-swatch-wrap{position:relative;width:28px;height:28px;border-radius:6px;overflow:hidden;border:1.5px solid var(--border-hi);cursor:pointer}
.color-swatch-wrap input[type=color]{position:absolute;inset:-4px;width:calc(100%+8px);height:calc(100%+8px);border:none;cursor:pointer}
.color-val{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--text-mid);flex:1}

/* stepper */
.stepper-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.stepper-label{font-size:11px;color:var(--text-dim);width:62px;flex-shrink:0}
.stepper{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--border-hi);border-radius:6px;overflow:hidden}
.stepper button{width:27px;height:27px;font-size:14px;color:var(--text-mid);transition:background .13s,color .13s}
.stepper button:hover{background:var(--surface);color:var(--text-hi)}
.stepper-val{font-size:12px;font-weight:500;color:var(--text-hi);width:26px;text-align:center;font-family:'JetBrains Mono',monospace}

/* toggle row */
.toggle-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.toggle-btn{font-size:11px;padding:4px 10px;border-radius:5px;color:var(--text-mid);background:var(--surface);border:1px solid var(--border-hi);transition:all .13s}
.toggle-btn:hover{color:var(--text-hi);background:var(--surface2)}
.toggle-btn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}

/* icon picker trigger */
.icon-trigger{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border-hi);border-radius:6px;padding:6px 9px;cursor:pointer;transition:border-color .15s}
.icon-trigger:hover{border-color:var(--border-hi)}
.icon-trigger svg{flex-shrink:0}
.icon-trigger-name{font-size:12px;color:var(--text-hi);flex:1}
.icon-trigger-hint{font-size:11px;color:var(--text-dim)}

/* block list */
.block-list{display:flex;flex-direction:column;gap:3px}
.block-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:border-color .14s,background .14s;user-select:none}
.block-row:hover{border-color:var(--border-hi);background:var(--surface2)}
.block-row.active{border-color:var(--accent);background:var(--accent-bg)}
.block-row-icon{flex-shrink:0;width:18px;display:flex;align-items:center;justify-content:center;color:var(--text-mid)}
.block-row-info{flex:1;min-width:0}
.block-row-type{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;font-weight:600}
.block-row-label{font-size:12px;color:var(--text-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block-row-actions{display:flex;gap:2px;opacity:0;transition:opacity .13s}
.block-row:hover .block-row-actions{opacity:1}
.block-row-btn{width:22px;height:22px;border-radius:4px;font-size:11px;color:var(--text-dim);display:flex;align-items:center;justify-content:center;transition:background .13s,color .13s}
.block-row-btn:hover{background:var(--surface);color:var(--text-hi)}
.block-row-btn.del:hover{background:var(--danger-bg);color:var(--danger)}
.add-block-row{display:flex;gap:5px;flex-wrap:wrap;padding-top:6px}
.add-block-btn{font-size:11px;color:var(--text-mid);background:var(--surface);border:1px dashed var(--border-hi);border-radius:6px;padding:4px 9px;transition:all .13s}
.add-block-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}

/* preset row */
.preset-row{display:flex;flex-wrap:wrap;gap:5px}
.preset-btn{font-size:11px;font-family:'JetBrains Mono',monospace;padding:4px 9px;border-radius:5px;color:var(--text-mid);background:var(--surface);border:1px solid var(--border-hi);transition:all .13s}
.preset-btn:hover{color:var(--text-hi);background:var(--surface2)}
.preset-btn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}

.no-selection{color:var(--text-dim);font-size:12px;text-align:center;padding:20px 0;line-height:1.7}
.sep{height:1px;background:var(--border);margin:8px 0}

/* ── ICON PICKER MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.hidden{display:none}
.icon-modal{background:var(--surface);border:1px solid var(--border-hi);border-radius:14px;width:440px;max-height:520px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,.6)}
.icon-modal-head{padding:14px 16px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.icon-modal-head input{width:100%;background:var(--surface2);border:1px solid var(--border-hi);border-radius:7px;color:var(--text-hi);font-size:13px;padding:7px 12px;outline:none}
.icon-modal-head input:focus{border-color:var(--accent)}
.icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:10px;overflow-y:auto;flex:1}
.icon-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:7px;padding:6px 2px;cursor:pointer;transition:background .13s;border:1px solid transparent}
.icon-cell:hover{background:var(--surface2);border-color:var(--border-hi)}
.icon-cell.active{background:var(--accent-bg);border-color:var(--accent)}
.icon-cell svg{pointer-events:none}
.icon-cell-name{font-size:8px;color:var(--text-dim);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;padding:0 2px}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--success);color:#fff;font-size:13px;font-weight:500;padding:9px 18px;border-radius:99px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="header">
  <div class="header-title">Omnicube <span>Editor</span></div>
  <div class="header-actions">
    <button class="btn btn-ghost" id="btn-reset">Reset</button>
    <button class="btn btn-primary" id="btn-export">↓ Export faces.js</button>
  </div>
</header>

<div class="editor-layout">
  <div class="panel">
    <div class="panel-head">Faces</div>
    <div class="panel-body" style="padding:8px"><div id="face-tabs"></div></div>
  </div>
  <div class="preview-center" id="preview-center">
    <div class="preview-face" id="preview-face"></div>
    <div class="preview-meta">
      <div class="preview-face-name" id="preview-name"></div>
      <div class="preview-grid-label" id="preview-grid-label"></div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head">Inspector</div>
    <div class="panel-body"><div class="inspector" id="inspector"></div></div>
  </div>
</div>

<!-- Icon picker modal -->
<div class="modal-overlay hidden" id="icon-modal-overlay">
  <div class="icon-modal">
    <div class="icon-modal-head">
      <input type="text" id="icon-search" placeholder="Search icons…" autocomplete="off">
    </div>
    <div class="icon-grid" id="icon-grid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════
//  ICON LIBRARY  (subset of Lucide)
// ══════════════════════════════════════════════════════
const ICONS = [
  'globe','flame','sparkles','leaf','star','waves','link','file-text','github',
  'linkedin','twitter','instagram','youtube','twitch','discord','slack','figma','dribbble',
  'mail','phone','map-pin','home','user','users','briefcase','graduation-cap',
  'code','code-2','terminal','cpu','database','server','cloud','layers',
  'layout-grid','box','cube','package','rocket','zap','bolt','lightning',
  'heart','bookmark','tag','hash','at-sign','send','share-2','external-link',
  'arrow-right','arrow-up-right','chevron-right','play','music','headphones','mic',
  'camera','image','video','monitor','smartphone','tablet','laptop',
  'shopping-bag','shopping-cart','credit-card','dollar-sign','euro','bitcoin',
  'calendar','clock','timer','bell','settings','tool','wrench','scissors',
  'pen','pencil','edit','type','align-left','list','grid','columns',
  'sun','moon','cloud-rain','wind','coffee','pizza','utensils','leaf',
  'tree','flower','mountain','waves','fish','bird','cat','dog',
  'award','trophy','target','flag','compass','map','navigation','search',
  'eye','lock','unlock','shield','key','fingerprint','wifi','bluetooth',
  'battery','power','plug','lightbulb','flash','activity','trending-up','bar-chart',
  'pie-chart','line-chart','table','filter','sort-asc','download','upload','refresh-cw',
  'check','x','plus','minus','slash','circle','square','triangle',
];

function mkSvg(name, size=18, color='currentColor') {
  const el = document.createElement('div');
  el.innerHTML = `<i data-lucide="${name}"></i>`;
  const i = el.querySelector('i');
  i.style.color = color;
  // We'll create via lucide after DOM insert
  return { name, size, color };
}

function renderIcon(name, size, color) {
  // Returns an SVG element via lucide
  const wrap = document.createElement('span');
  wrap.dataset.lucideWrap = name;
  wrap.dataset.lucideSize = size;
  wrap.dataset.lucideColor = color || 'currentColor';
  return wrap;
}

function hydrateIcons(root) {
  root.querySelectorAll('[data-lucide-wrap]').forEach(wrap => {
    const name  = wrap.dataset.lucideWrap;
    const size  = parseInt(wrap.dataset.lucideSize) || 18;
    const color = wrap.dataset.lucideColor || 'currentColor';
    if (lucide && lucide.createElement) {
      try {
        const Icon = lucide.icons[toCamel(name)];
        if (!Icon) return;
        const svgStr = lucide.toSvg(Icon, { width: size, height: size, color, 'stroke-width': 1.8 });
        wrap.innerHTML = svgStr;
      } catch(e) {}
    }
  });
}

function toCamel(str) {
  return str.split('-').map((s,i) => i===0 ? s : s[0].toUpperCase()+s.slice(1)).join('');
}

function lucideSvgStr(name, size, color) {
  try {
    const key  = Object.keys(lucide.icons).find(k => k.toLowerCase() === toCamel(name).toLowerCase());
    if (!key) return null;
    return lucide.toSvg(lucide.icons[key], { width: size, height: size, color: color||'currentColor', 'stroke-width': 1.8 });
  } catch(e) { return null; }
}

// ══════════════════════════════════════════════════════
//  DEFAULT DATA
// ══════════════════════════════════════════════════════
const FACE_GRADIENTS = [
  ['#3b82f6','#1d4ed8'],['#f97316','#c2410c'],['#8b5cf6','#6d28d9'],
  ['#10b981','#065f46'],['#ec4899','#9d174d'],['#06b6d4','#0e7490'],
];

function defaultStyle() {
  return { bg:'', iconColor:'#ffffff', textColor:'#ffffff', fontSize:'md', bold:false, italic:false };
}

const DEFAULT_FACES = [
  { id:0, name:'World', navIcon:'🌐', color:{from:'#3b82f6',to:'#1d4ed8'}, grid:{cols:2,rows:3}, blocks:[
    {type:'header', span:[2,1], style:defaultStyle(), content:{text:'Ivan Shishkin'}},
    {type:'link',   span:[1,1], style:defaultStyle(), content:{label:'Portfolio', icon:'link',     url:'#'}},
    {type:'link',   span:[1,1], style:defaultStyle(), content:{label:'Blog',      icon:'file-text',url:'#'}},
    {type:'social', span:[1,1], style:defaultStyle(), content:{platform:'github',   label:'GitHub',   icon:'github',   url:'#'}},
    {type:'social', span:[1,1], style:defaultStyle(), content:{platform:'linkedin', label:'LinkedIn', icon:'linkedin', url:'#'}},
  ]},
  { id:1, name:'Fire', navIcon:'🔥', color:{from:'#f97316',to:'#c2410c'}, grid:{cols:2,rows:3}, blocks:[
    {type:'image', span:[2,2], style:defaultStyle(), content:{icon:'layers', caption:'Latest project'}},
    {type:'link',  span:[1,1], style:defaultStyle(), content:{label:'Source',    icon:'github',       url:'#'}},

const BLOCK_DEFAULTS = {
  header:  { text:'Title' },
  link:    { label:'Link', icon:'link', url:'#' },
  social:  { platform:'github', label:'GitHub', icon:'github', url:'#' },
  text:    { body:'Your text here…' },
  image:   { icon:'image', caption:'' },
  embed:   { provider:'Spotify', icon:'music', label:'Now playing' },
  divider: {},
};

const GRID_PRESETS = [
  {label:'1×1',cols:1,rows:1},{label:'1×2',cols:1,rows:2},{label:'1×3',cols:1,rows:3},
  {label:'2×2',cols:2,rows:2},{label:'2×3',cols:2,rows:3},{label:'2×4',cols:2,rows:4},{label:'3×3',cols:3,rows:3},
];

const FS_SIZES = ['xs','sm','md','lg','xl'];

// ══════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════
let faces       = JSON.parse(JSON.stringify(DEFAULT_FACES));
let activeFace  = 0;
let activeBlock = null;
let iconPickerCb = null;

// ══════════════════════════════════════════════════════
//  BLOCK RENDER
// ══════════════════════════════════════════════════════
const ICON_SIZE_MAP = { xs:12, sm:14, md:18, lg:22, xl:28 };

function blockHtml(block) {
  const c  = block.content;
  const s  = block.style || defaultStyle();
  const sz = ICON_SIZE_MAP[s.fontSize] || 18;
  const ic = s.iconColor || '#ffffff';

  function svgOrFallback(name) {
    const svg = lucideSvgStr(name, sz, ic);
    return svg || `<span style="font-size:${sz}px;color:${ic}">◆</span>`;
  }

  switch (block.type) {
    case 'header':
      return `<span class="block-text-main" style="color:${s.textColor||'#fff'}">${c.text||''}</span>`;
    case 'link':
    case 'social':
      return `${svgOrFallback(c.icon||'link')}<span class="block-text-main" style="color:${s.textColor||'#fff'}">${c.label||''}</span>`;
    case 'text':
      return `<span class="block-body" style="color:${s.textColor||'rgba(255,255,255,.8)'}">${c.body||''}</span>`;
    case 'image':
      return `${svgOrFallback(c.icon||'image')}${c.caption?`<span class="block-caption" style="color:${s.textColor||'rgba(255,255,255,.55)'}">${c.caption}</span>`:''}`;
    case 'embed':
      return `${svgOrFallback(c.icon||'music')}<span class="block-text-main" style="color:${s.textColor||'#fff'}">${c.label||''}</span><span class="block-sub">${c.provider||''}</span>`;
    default: return '';
  }
}

function renderBlockEl(block, idx) {
  const s   = block.style || defaultStyle();
  const el  = document.createElement('div');
  const fsCls = `fs-${s.fontSize||'md'}`;
  const boldCls = s.bold ? 'txt-bold' : '';
  const italCls = s.italic ? 'txt-italic' : '';
  el.className = `block block-${block.type} ${fsCls} ${boldCls} ${italCls}`.trim();
  if (idx === activeBlock) el.classList.add('selected-block');
  el.style.gridColumn = `span ${block.span[0]}`;
  el.style.gridRow    = `span ${block.span[1]}`;
  el.style.cursor     = 'pointer';
  if (s.bg) el.style.background = s.bg;
  el.innerHTML = blockHtml(block);
  el.addEventListener('click', e => { e.stopPropagation(); activeBlock = activeBlock===idx?null:idx; render(); });
  return el;
}

function renderPreview() {
  const face = faces[activeFace];
  const el   = document.getElementById('preview-face');
  el.style.background = `linear-gradient(150deg, ${face.color.from}, ${face.color.to})`;
  el.className = 'preview-face';

  const grid = document.createElement('div');
  grid.className = 'block-grid';
  grid.style.gridTemplateColumns = `repeat(${face.grid.cols},1fr)`;
  grid.style.gridTemplateRows    = `repeat(${face.grid.rows},1fr)`;
  face.blocks.forEach((b,i) => grid.appendChild(renderBlockEl(b,i)));
  el.innerHTML = '';
  el.appendChild(grid);
  document.getElementById('preview-name').textContent       = face.name;
  document.getElementById('preview-grid-label').textContent = `${face.grid.cols} × ${face.grid.rows}`;
}

// ══════════════════════════════════════════════════════
//  FACE TABS
// ══════════════════════════════════════════════════════
function renderFaceTabs() {
  const el = document.getElementById('face-tabs');
  el.innerHTML = '';
  faces.forEach((face,i) => {
    const tab = document.createElement('div');
    tab.className = `face-tab${i===activeFace?' active':''}`;
    const dot = document.createElement('div');
    dot.className = 'face-tab-dot';
    dot.style.background = `linear-gradient(135deg,${face.color.from},${face.color.to})`;
    const info = document.createElement('div');
    info.innerHTML = `<div class="face-tab-name">${face.navIcon ? face.navIcon + ' ' : ''}${face.name}</div><div class="face-tab-meta">${face.grid.cols}×${face.grid.rows} · ${face.blocks.length}b</div>`;
    tab.appendChild(dot); tab.appendChild(info);
    tab.addEventListener('click', () => { activeFace=i; activeBlock=null; render(); });
    el.appendChild(tab);
  });
}

// ══════════════════════════════════════════════════════
//  INSPECTOR
// ══════════════════════════════════════════════════════
function renderInspector() {
  const face = faces[activeFace];
  const el   = document.getElementById('inspector');
  el.innerHTML = '';

  // ─ Face section ─
  const fs = sect('Face');
  fs.appendChild(field('Name','text', face.name, v => { face.name=v; renderFaceTabs(); renderPreview(); }));

  // Nav icon
  const niRow = document.createElement('div');
  niRow.style.cssText = 'display:flex;align-items:center;gap:10px;margin-bottom:10px';
  const niLabel = document.createElement('label');
  niLabel.style.cssText = 'font-size:11px;color:var(--text-dim);font-weight:500;min-width:62px';
  niLabel.textContent = 'Nav icon';
  const niInput = document.createElement('input');
  niInput.type  = 'text';
  niInput.value = face.navIcon || '';
  niInput.placeholder = 'emoji';
  niInput.style.cssText = 'background:var(--surface2);border:1px solid var(--border-hi);border-radius:6px;color:var(--text-hi);font-size:20px;padding:4px 10px;outline:none;width:64px;text-align:center';
  niInput.addEventListener('input', () => {
    // Take only the first emoji grapheme cluster
    const chars = [...niInput.value];
    face.navIcon = chars[0] || '';
    niInput.value = face.navIcon;
    renderFaceTabs();
  });
  niRow.appendChild(niLabel);
  niRow.appendChild(niInput);
  // small hint
  const niHint = document.createElement('span');
  niHint.style.cssText = 'font-size:10px;color:var(--text-dim)';
  niHint.textContent = 'shown in nav bar';
  niRow.appendChild(niHint);
  fs.appendChild(niRow);

  // Panel gradient
  const gcl = sublabel('Panel colour');
  fs.appendChild(gcl);
  const gRow = document.createElement('div');
  gRow.style.cssText = 'display:flex;gap:8px;margin-bottom:8px';
  gRow.appendChild(colorField('From', face.color.from, v => { face.color.from=v; renderFaceTabs(); renderPreview(); }));
  gRow.appendChild(colorField('To',   face.color.to,   v => { face.color.to=v;   renderFaceTabs(); renderPreview(); }));
  fs.appendChild(gRow);

  // Grid
  fs.appendChild(sublabel('Grid'));
  fs.appendChild(stepper('Columns', face.grid.cols, 1, 4, v => { face.grid.cols=v; renderPreview(); renderFaceTabs(); }));
  fs.appendChild(stepper('Rows',    face.grid.rows, 1, 6, v => { face.grid.rows=v; renderPreview(); renderFaceTabs(); }));
  const pr = document.createElement('div'); pr.className='preset-row'; pr.style.marginBottom='4px';
  GRID_PRESETS.forEach(p => {
    const b = document.createElement('button');
    b.className = `preset-btn${face.grid.cols===p.cols&&face.grid.rows===p.rows?' on':''}`;
    b.textContent = p.label;
    b.addEventListener('click', () => { face.grid.cols=p.cols; face.grid.rows=p.rows; render(); });
    pr.appendChild(b);
  });
  fs.appendChild(pr);
  el.appendChild(fs);

  // ─ Block list ─
  const bs = sect('Blocks');
  const bl = document.createElement('div'); bl.className='block-list';
  face.blocks.forEach((block,i) => {
    const row = document.createElement('div');
    row.className = `block-row${i===activeBlock?' active':''}`;
    const iconWrap = document.createElement('div'); iconWrap.className='block-row-icon';
    const icName = block.content.icon||'square';
    const svg = lucideSvgStr(icName,14,'currentColor');
    iconWrap.innerHTML = svg || block.type[0].toUpperCase();
    const info = document.createElement('div'); info.className='block-row-info';
    info.innerHTML = `<div class="block-row-type">${block.type}</div><div class="block-row-label">${rowLabel(block)}</div>`;
    const acts = document.createElement('div'); acts.className='block-row-actions';
    ['↑','↓','✕'].forEach((lbl,ai) => {
      const b = document.createElement('button');
      b.className = `block-row-btn${ai===2?' del':''}`;
      b.textContent = lbl;
      b.addEventListener('click', e => {
        e.stopPropagation();
        if (ai===0 && i>0) { swap(face.blocks,i,i-1); if(activeBlock===i)activeBlock=i-1; else if(activeBlock===i-1)activeBlock=i; }
        else if (ai===1 && i<face.blocks.length-1) { swap(face.blocks,i,i+1); if(activeBlock===i)activeBlock=i+1; else if(activeBlock===i+1)activeBlock=i; }
        else if (ai===2) { face.blocks.splice(i,1); if(activeBlock===i)activeBlock=null; else if(activeBlock>i)activeBlock--; }
        render();
      });
      acts.appendChild(b);
    });
    row.appendChild(iconWrap); row.appendChild(info); row.appendChild(acts);
    row.addEventListener('click', e => { if(e.target.closest('.block-row-actions'))return; activeBlock=activeBlock===i?null:i; render(); });
    bl.appendChild(row);
  });
  bs.appendChild(bl);
  const addRow = document.createElement('div'); addRow.className='add-block-row';
  Object.keys(BLOCK_DEFAULTS).forEach(type => {
    const b = document.createElement('button'); b.className='add-block-btn'; b.textContent=`+ ${type}`;
    b.addEventListener('click', () => { face.blocks.push({type,span:[1,1],style:defaultStyle(),content:JSON.parse(JSON.stringify(BLOCK_DEFAULTS[type]))}); activeBlock=face.blocks.length-1; render(); });
    addRow.appendChild(b);
  });
  bs.appendChild(addRow);
  el.appendChild(bs);

  // ─ Block editor ─
  if (activeBlock!==null && face.blocks[activeBlock]) {
    el.appendChild(mkBlockEditor(face.blocks[activeBlock]));
  } else {
    const hint = document.createElement('div');
    hint.className='no-selection';
    hint.textContent='Select a block in the\npreview or list to edit it';
    el.appendChild(hint);
  }
}

function mkBlockEditor(block) {
  const s = block.style || (block.style = defaultStyle());
  const c = block.content;
  const sec = sect(`Block · ${block.type}`);

  // Span
  sec.appendChild(stepper('Col span', block.span[0], 1, 4, v => { block.span[0]=v; renderPreview(); }));
  sec.appendChild(stepper('Row span', block.span[1], 1, 4, v => { block.span[1]=v; renderPreview(); }));
  sec.appendChild(div('sep'));

  // Content fields
  switch (block.type) {
    case 'header':
      sec.appendChild(field('Text','text',c.text,v=>{c.text=v;renderPreview();})); break;
    case 'link':
      sec.appendChild(field('Label','text',c.label,v=>{c.label=v;renderPreview();renderInspector();}));
      sec.appendChild(iconPickerField('Icon',c.icon,v=>{c.icon=v;renderPreview();renderInspector();}));
      sec.appendChild(field('URL','text',c.url,v=>{c.url=v;})); break;
    case 'social':
      sec.appendChild(field('Label','text',c.label,v=>{c.label=v;renderPreview();renderInspector();}));
      sec.appendChild(iconPickerField('Icon',c.icon,v=>{c.icon=v;renderPreview();renderInspector();}));
      sec.appendChild(field('Platform','text',c.platform,v=>{c.platform=v;}));
      sec.appendChild(field('URL','text',c.url,v=>{c.url=v;})); break;
    case 'text':
      sec.appendChild(field('Body','textarea',c.body,v=>{c.body=v;renderPreview();})); break;
    case 'image':
      sec.appendChild(iconPickerField('Icon',c.icon,v=>{c.icon=v;renderPreview();}));
      sec.appendChild(field('Caption','text',c.caption,v=>{c.caption=v;renderPreview();})); break;
    case 'embed':
      sec.appendChild(field('Label','text',c.label,v=>{c.label=v;renderPreview();renderInspector();}));
      sec.appendChild(iconPickerField('Icon',c.icon,v=>{c.icon=v;renderPreview();renderInspector();}));
      sec.appendChild(field('Provider','text',c.provider,v=>{c.provider=v;renderPreview();})); break;
  }

  sec.appendChild(div('sep'));

  // Colours
  sec.appendChild(sublabel('Colours'));
  const crow = document.createElement('div'); crow.style.cssText='display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px';
  crow.appendChild(colorField('Block bg', s.bg||'', v=>{s.bg=v;renderPreview();}, true));
  crow.appendChild(colorField('Icon',     s.iconColor||'#ffffff', v=>{s.iconColor=v;renderPreview();}));
  crow.appendChild(colorField('Text',     s.textColor||'#ffffff', v=>{s.textColor=v;renderPreview();}));
  sec.appendChild(crow);

  sec.appendChild(div('sep'));

  // Text style
  sec.appendChild(sublabel('Text style'));

  // Font size
  const szRow = document.createElement('div'); szRow.className='toggle-row';
  FS_SIZES.forEach(sz => {
    const b = document.createElement('button');
    b.className = `toggle-btn${s.fontSize===sz?' on':''}`;
    b.textContent = sz.toUpperCase();
    b.addEventListener('click',()=>{s.fontSize=sz;renderPreview();renderInspector();});
    szRow.appendChild(b);
  });
  sec.appendChild(szRow);

  // Bold / Italic
  const styleRow = document.createElement('div'); styleRow.className='toggle-row';
  [{lbl:'Bold',key:'bold'},{lbl:'Italic',key:'italic'}].forEach(({lbl,key}) => {
    const b = document.createElement('button');
    b.className = `toggle-btn${s[key]?' on':''}`;
    b.style.fontWeight = key==='bold'?'700':'400';
    b.style.fontStyle  = key==='italic'?'italic':'normal';
    b.textContent = lbl;
    b.addEventListener('click',()=>{s[key]=!s[key];renderPreview();renderInspector();});
    styleRow.appendChild(b);
  });
  sec.appendChild(styleRow);

  sec.appendChild(div('sep'));

  // Delete
  const del = document.createElement('button');
  del.className='btn btn-danger'; del.style.width='100%'; del.textContent='Remove block';
  del.addEventListener('click',()=>{faces[activeFace].blocks.splice(activeBlock,1);activeBlock=null;render();});
  sec.appendChild(del);

  return sec;
}

// ══════════════════════════════════════════════════════
//  ICON PICKER
// ══════════════════════════════════════════════════════
function openIconPicker(current, cb) {
  iconPickerCb = cb;
  const overlay = document.getElementById('icon-modal-overlay');
  const grid    = document.getElementById('icon-grid');
  const search  = document.getElementById('icon-search');
  overlay.classList.remove('hidden');
  search.value = '';
  search.focus();
  renderIconGrid(current, '');
  search.oninput = () => renderIconGrid(current, search.value.trim().toLowerCase());
}

function renderIconGrid(current, query) {
  const grid = document.getElementById('icon-grid');
  grid.innerHTML = '';
  const list = query ? ICONS.filter(n => n.includes(query)) : ICONS;
  list.forEach(name => {
    const cell = document.createElement('div');
    cell.className = `icon-cell${name===current?' active':''}`;
    const svg = lucideSvgStr(name, 18, 'currentColor') || '';
    cell.innerHTML = `${svg}<div class="icon-cell-name">${name.replace(/-/g,' ')}</div>`;
    cell.addEventListener('click', () => {
      if (iconPickerCb) iconPickerCb(name);
      document.getElementById('icon-modal-overlay').classList.add('hidden');
    });
    grid.appendChild(cell);
  });
}

document.getElementById('icon-modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.add('hidden');
});

// ══════════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════════
function sect(title) {
  const s = document.createElement('div'); s.className='insp-section';
  const t = document.createElement('div'); t.className='insp-section-title'; t.textContent=title;
  s.appendChild(t); return s;
}
function sublabel(text) {
  const d = document.createElement('div'); d.style.cssText='font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin:8px 0 6px'; d.textContent=text; return d;
}
function div(cls) { const d=document.createElement('div'); d.className=cls; return d; }
function swap(arr,a,b) { [arr[a],arr[b]]=[arr[b],arr[a]]; }
function rowLabel(block) {
  const c=block.content; return c.label||c.text||c.body?.slice(0,28)||c.provider||'—';
}

function field(label, type, value, onChange) {
  const wrap = document.createElement('div'); wrap.className='field';
  const lbl  = document.createElement('label'); lbl.textContent=label; wrap.appendChild(lbl);
  let inp;
  if (type==='textarea') { inp=document.createElement('textarea'); inp.rows=3; } else { inp=document.createElement('input'); inp.type=type; }
  inp.value = value||''; inp.addEventListener('input',()=>onChange(inp.value));
  wrap.appendChild(inp); return wrap;
}

function colorField(label, value, onChange, allowEmpty=false) {
  const wrap = document.createElement('div');
  wrap.style.cssText='display:flex;flex-direction:column;gap:4px';
  const lbl = document.createElement('div'); lbl.style.cssText='font-size:10px;color:var(--text-dim)'; lbl.textContent=label;
  wrap.appendChild(lbl);

  const swatchWrap = document.createElement('div'); swatchWrap.className='color-swatch-wrap';
  const actualColor = value && value!=='' ? value : '#1c2333';
  swatchWrap.style.background = actualColor;

  const inp = document.createElement('input'); inp.type='color'; inp.value=actualColor;
  inp.addEventListener('input', () => { swatchWrap.style.background=inp.value; onChange(inp.value); });
  if (allowEmpty) {
    // Show as "none" if empty
    if (!value) { swatchWrap.style.background='transparent'; swatchWrap.style.backgroundImage='linear-gradient(45deg,#333 25%,transparent 25%),linear-gradient(-45deg,#333 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#333 75%),linear-gradient(-45deg,transparent 75%,#333 75%)'; swatchWrap.style.backgroundSize='6px 6px'; swatchWrap.style.backgroundPosition='0 0,0 3px,3px -3px,-3px 0px'; }
    // Right-click or double-click to clear
    swatchWrap.title = 'Pick colour · Double-click to clear (use block default)';
    swatchWrap.addEventListener('dblclick', e => { e.preventDefault(); onChange(''); swatchWrap.style.background='transparent'; swatchWrap.style.backgroundImage='linear-gradient(45deg,#333 25%,transparent 25%),linear-gradient(-45deg,#333 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#333 75%),linear-gradient(-45deg,transparent 75%,#333 75%)'; swatchWrap.style.backgroundSize='6px 6px'; });
  }
  swatchWrap.appendChild(inp); wrap.appendChild(swatchWrap);
  return wrap;
}

function iconPickerField(label, current, onChange) {
  const wrap = document.createElement('div'); wrap.className='field';
  const lbl  = document.createElement('label'); lbl.textContent=label; wrap.appendChild(lbl);
  const trigger = document.createElement('div'); trigger.className='icon-trigger';
  const svgEl = document.createElement('span');
  svgEl.innerHTML = lucideSvgStr(current||'square',16,'currentColor')||'';
  const name = document.createElement('span'); name.className='icon-trigger-name'; name.textContent=current||'none';
  const hint = document.createElement('span'); hint.className='icon-trigger-hint'; hint.textContent='click to change';
  trigger.appendChild(svgEl); trigger.appendChild(name); trigger.appendChild(hint);
  trigger.addEventListener('click', () => openIconPicker(current, v => { onChange(v); }));
  wrap.appendChild(trigger); return wrap;
}

function stepper(label, value, min, max, onChange) {
  const row = document.createElement('div'); row.className='stepper-row';
  const lbl = document.createElement('span'); lbl.className='stepper-label'; lbl.textContent=label;
  const s   = document.createElement('div'); s.className='stepper';
  const dec = document.createElement('button'); dec.textContent='−';
  const val = document.createElement('span'); val.className='stepper-val'; val.textContent=value;
  const inc = document.createElement('button'); inc.textContent='+';
  let v=value;
  dec.addEventListener('click',()=>{if(v<=min)return;v--;val.textContent=v;onChange(v);});
  inc.addEventListener('click',()=>{if(v>=max)return;v++;val.textContent=v;onChange(v);});
  s.appendChild(dec); s.appendChild(val); s.appendChild(inc);
  row.appendChild(lbl); row.appendChild(s); return row;
}

// ══════════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════════
function render() { renderFaceTabs(); renderPreview(); renderInspector(); }

// ══════════════════════════════════════════════════════
//  EXPORT
// ══════════════════════════════════════════════════════
function exportFaces() {
  const lines = ['export const FACES = ['];
  faces.forEach((face,fi) => {
    lines.push('  {');
    lines.push(`    id: ${face.id},`);
    lines.push(`    name: ${JSON.stringify(face.name)},`);
    lines.push(`    navIcon: ${JSON.stringify(face.navIcon || '')},`);
    lines.push(`    color: { from: ${JSON.stringify(face.color.from)}, to: ${JSON.stringify(face.color.to)} },`);
    lines.push(`    grid: { cols: ${face.grid.cols}, rows: ${face.grid.rows} },`);
    lines.push('    blocks: [');
    face.blocks.forEach(block => {
      lines.push(`      { type: ${JSON.stringify(block.type)}, span: [${block.span[0]},${block.span[1]}], style: ${JSON.stringify(block.style)}, content: ${JSON.stringify(block.content)} },`);
    });
    lines.push('    ]');
    lines.push(fi<faces.length-1?'  },':'  }');
  });
  lines.push('];','');
  const blob = new Blob([lines.join('\n')],{type:'application/javascript'});
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'),{href:url,download:'faces.js'});
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('Exported faces.js');
}

function toast(msg) {
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}

document.getElementById('btn-export').addEventListener('click', exportFaces);
document.getElementById('btn-reset').addEventListener('click', () => {
  if(!confirm('Reset all faces to defaults?'))return;
  faces=JSON.parse(JSON.stringify(DEFAULT_FACES)); activeBlock=null; render(); toast('Reset to defaults');
});
document.getElementById('preview-center').addEventListener('click', () => { activeBlock=null; render(); });

render();
</script>
</body>
</html>
